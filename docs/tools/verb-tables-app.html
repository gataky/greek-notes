<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greek Verb Tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=GFS+Didot&display=swap">
<link rel="stylesheet" href="verb-grid.css">
<style>
/* Verb picker */
.picker { position: relative; display: flex; gap: 10px; }
#search { flex: 1; min-width: 0; font: 400 20px var(--body); padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
#search:focus { border-color: var(--accent); outline: none; }
.btn { appearance: none; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font: 600 15px var(--body); padding: 10px 16px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
#results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 5; margin: 0; padding: 6px; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgb(0 0 0 / .12); max-height: 340px; overflow-y: auto; }
#results li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
#results li[aria-selected="true"] { background: var(--accent-soft); }
#results .g { font-family: var(--display); font-size: 19px; }
#results .e { color: var(--muted); font-size: 14px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#results .none { color: var(--muted); cursor: default; }

/* Verb list, grouped by class */
.list { display: flex; flex-direction: column; gap: 10px; }
.list > h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }
.list details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; }
.list summary { cursor: pointer; font-weight: 600; font-size: 15px; padding: 2px 0; }
.list summary .pattern { font-family: var(--display); font-weight: 400; font-size: 17px; color: var(--accent); margin-left: 8px; }
.list summary .count { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
/* Columns read top to bottom, like a dictionary */
.list ul { list-style: none; margin: 10px 0 2px; padding: 0 0 0 8px; columns: 210px; column-gap: 22px; }
.list li { break-inside: avoid; }
.list a { display: flex; align-items: baseline; gap: 8px; padding: 4px 8px; margin: 0 -8px; border-radius: 8px; color: var(--ink); text-decoration: none; min-width: 0; }
.list a:hover { background: var(--accent-soft); }
.list a[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.list a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.list .g { font-family: var(--display); font-size: 18px; white-space: nowrap; }
.list .e { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Verbs</div>
    <h1>Greek Verb Tables</h1>
    <p class="sub">Pick a verb to see its forms. Each verb has two stems, continuous and simple, and each has a present and a past set. Every other tense is built from these.</p>
  </header>

  <div class="picker">
    <input id="search" type="search" lang="el" autocomplete="off" spellcheck="false" placeholder="Search in Greek or English…"
      role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" aria-label="Find a verb">
    <button class="btn" id="random" type="button">Random</button>
    <ul id="results" role="listbox" hidden></ul>
  </div>

  <section class="card" id="card" aria-live="polite"></section>

  <nav class="list" id="list" aria-label="All verbs"></nav>
</div>

<script src="greek-verbs.js"></script>
<script src="verb-grid.js"></script>
<script>
const { strip } = GreekVerbs;

const { cardHTML, esc, PATTERN_ENDINGS, CLASS_ORDER } = VerbGrid;
const $ = id => document.getElementById(id);
const render = verb => { $("card").innerHTML = cardHTML(verb); };


// ---------- Verb picker ----------

let verbs = [];
let current = null;
let matches = [];
let active = -1;

const fold = s => strip(s.toLowerCase().normalize("NFC")).replace(/ς/g, "σ");

function select(verb, { scroll = false } = {}) {
  current = verb;
  $("search").value = "";
  closeResults();
  history.replaceState(null, "", "#" + encodeURIComponent(verb.greek));
  render(verb);
  document.querySelectorAll("#list a").forEach(a => a.setAttribute("aria-current", String(a.dataset.greek === verb.greek)));
  if (scroll) $("card").scrollIntoView({ behavior: "smooth", block: "start" });
}

// ---------- Verb list ----------

function renderList() {
  const groups = new Map();
  for (const v of verbs) {
    const cls = v.class || "other";
    if (!groups.has(cls)) groups.set(cls, []);
    groups.get(cls).push(v);
  }
  const rank = cls => (CLASS_ORDER.includes(cls) ? CLASS_ORDER.indexOf(cls) : CLASS_ORDER.length);
  const sections = [...groups].sort((a, b) => rank(a[0]) - rank(b[0])).map(([cls, list]) => {
    const pattern = PATTERN_ENDINGS[cls] && PATTERN_ENDINGS[cls] !== cls ? `<span class="pattern">${esc(PATTERN_ENDINGS[cls])}</span>` : "";
    const items = list.map(v => `<li><a href="#${encodeURIComponent(v.greek)}" data-greek="${esc(v.greek)}" title="${esc(v.english || "")}">
        <span class="g" lang="el">${esc(v.greek)}</span><span class="e">${esc(v.english || "")}</span></a></li>`).join("");
    return `<details open><summary>${esc(cls)}${pattern}<span class="count">${list.length}</span></summary><ul>${items}</ul></details>`;
  });
  $("list").innerHTML = `<h2>All verbs · ${verbs.length}</h2>` + sections.join("");
}

$("list").addEventListener("click", e => {
  const a = e.target.closest("a[data-greek]");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;  // let modified clicks open a new tab
  e.preventDefault();
  select(verbs.find(v => v.greek === a.dataset.greek), { scroll: true });
});

function search(query) {
  const q = fold(query.trim());
  if (!q) return [];
  const scored = [];
  for (const v of verbs) {
    const g = fold(v.greek), e = (v.english || "").toLowerCase();
    const score = g.startsWith(q) ? 0 : g.includes(q) ? 1 : e.split(/[^a-z]+/).some(w => w.startsWith(q)) ? 2 : e.includes(q) ? 3 : -1;
    if (score >= 0) scored.push([score, v]);
  }
  return scored.sort((a, b) => a[0] - b[0]).slice(0, 12).map(s => s[1]);
}

function showResults() {
  const list = $("results");
  if (!$("search").value.trim()) return closeResults();
  list.innerHTML = matches.length
    ? matches.map((v, i) => `<li role="option" id="opt-${i}" data-i="${i}" aria-selected="${i === active}"><span class="g" lang="el">${esc(v.greek)}</span><span class="e">${esc(v.english || "")}</span></li>`).join("")
    : `<li class="none">No verb matches.</li>`;
  list.hidden = false;
  $("search").setAttribute("aria-expanded", "true");
  $("search").setAttribute("aria-activedescendant", active >= 0 ? `opt-${active}` : "");
}

function closeResults() {
  $("results").hidden = true;
  $("search").setAttribute("aria-expanded", "false");
  active = -1;
}

$("search").addEventListener("input", e => {
  matches = search(e.target.value);
  active = matches.length ? 0 : -1;
  showResults();
});

$("search").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!matches.length) return;
    e.preventDefault();
    active = (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length;
    showResults();
    document.getElementById(`opt-${active}`)?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter" && active >= 0) {
    e.preventDefault();
    select(matches[active]);
  } else if (e.key === "Escape") {
    closeResults();
  }
});

$("results").addEventListener("mousedown", e => {
  const li = e.target.closest("li[data-i]");
  if (li) { e.preventDefault(); select(matches[+li.dataset.i]); }
});
$("search").addEventListener("blur", closeResults);

$("random").addEventListener("click", () => {
  const others = verbs.filter(v => v !== current);
  select(others[Math.floor(Math.random() * others.length)]);
});

// ---------- Start ----------

fetch("verbs.json")
  .then(r => r.json())
  .then(data => {
    verbs = data.sort((a, b) => fold(a.greek).localeCompare(fold(b.greek), "el"));
    renderList();
    const wanted = decodeURIComponent(location.hash.slice(1));
    select(verbs.find(v => v.greek === wanted) || verbs.find(v => v.greek === "γράφω") || verbs[0]);
  })
  .catch(() => {
    $("card").innerHTML = `<p class="note">Couldn't load verbs.json. Open this page through the site (make serve), not straight from disk.</p>`;
  });
</script>
</body>
</html>
