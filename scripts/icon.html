<!doctype html><meta charset="utf-8">
<!--
  Source of the app icons in docs/icons/. To re-render, from the repo root:
    CH="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$CH" --headless --hide-scrollbars --force-device-scale-factor=2 --window-size=512,512 \
      --screenshot=$PWD/icon-1024.png file://$PWD/scripts/icon.html
    sips -s format png -Z 512 icon-1024.png --out docs/icons/icon-512.png
    sips -s format png -Z 192 icon-1024.png --out docs/icons/icon-192.png
    sips -s format png -Z 180 icon-1024.png --out docs/icons/apple-touch-icon.png
  Keep the letters and the key inside the centre circle (radius 205 of 512): the manifest marks the icons maskable.
-->

@font-face{font-family:"GD";src:url(../docs/fonts/gfs-didot-greek.woff2)}

svg{display:block;width:100vw;height:100vh}
</style>
