  has its own background colour; the hub has the Αα and Greek key, the others a Material Symbols
  glyph (Apache 2.0): the dictionary "dictionary", the drills "fitness_center", the notes
  "description". To re-render, from the repo root:
    CH="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    for app in home dictionary drills notes; do
      "$CH" --headless --hide-scrollbars --force-device-scale-factor=2 --window-size=512,512 \
        --screenshot=$PWD/icon-1024.png "file://$PWD/scripts/icon.html?app=$app"
      for size in 512 192 180; do sips -s format png -Z $size icon-1024.png --out docs/icons/$app-$size.png; done
    done
    rm icon-1024.png
  Keep the letters, the key and the glyphs inside the centre circle (radius 205 of 512): the manifest
  marks the icons maskable. A 24-unit glyph at scale 12 reaches at most 170 from the centre.
-->
