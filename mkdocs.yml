site_name: Greek Dictionary
site_description: A Greek and English dictionary that works offline

theme:
  name: material
  custom_dir: overrides
  favicon: app/icon-192.png
  language: en
  font:
    text: Noto Serif
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/frames.css
  - stylesheets/tables.css
  - stylesheets/home.css

extra_javascript:
  - javascripts/drill-frame.js
  - javascripts/home.js
  - javascripts/tables.js
  - javascripts/pwa.js

hooks:
  - hooks/pwa.py

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true

nav:
  - Dictionary: index.md
  - Grammar:
      - Articles: greek-articles.md
      - Adjectives: greek-adjectives.md
      - Pronouns:
          - Overview: pronouns/index.md
          - Personal: pronouns/personal.md
          - Possessive: pronouns/possessive.md
          - Demonstrative: pronouns/demonstrative.md
          - Interrogative: pronouns/interrogative.md
          - Relative: pronouns/relative.md
          - Indefinite: pronouns/indefinite.md
          - Reflexive and emphatic: pronouns/reflexive.md
      - Numerals: greek-numerals.md
      - Conjunctions: greek-conjunctions.md
      - Prepositions: greek-prepositions.md
      - Passive verbs: greek-passive-verbs-when-to-use-them.md
  - Drills:
      - Passive verbs: drills/passive-verbs.md
  - Tools:
      - Verb tables: tools/verb-tables.md
      - Conjugation patterns: tools/conjugation-patterns.md
