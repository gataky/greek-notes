site_name: Greek Dictionary
site_description: A Greek and English dictionary that works offline

theme:
  name: material
  custom_dir: overrides
  favicon: icons/icon-192.png
  language: en
  font:
    text: Noto Serif
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/frames.css
  - stylesheets/tables.css
  - stylesheets/home.css

extra_javascript:
  - javascripts/drill-frame.js
  - javascripts/home.js
  - javascripts/tables.js
  - javascripts/pwa.js

hooks:
  - hooks/pwa.py

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true

nav:
  - Dictionary: index.md
  - Grammar:
      - Articles: grammar/articles.md
      - Adjectives: grammar/adjectives.md
      - Pronouns:
          - Overview: grammar/pronouns/index.md
          - Personal: grammar/pronouns/personal.md
          - Possessive: grammar/pronouns/possessive.md
          - Demonstrative: grammar/pronouns/demonstrative.md
          - Interrogative: grammar/pronouns/interrogative.md
          - Relative: grammar/pronouns/relative.md
          - Indefinite: grammar/pronouns/indefinite.md
          - Reflexive and emphatic: grammar/pronouns/reflexive.md
      - Numerals: grammar/numerals.md
      - Conjunctions: grammar/conjunctions.md
      - Prepositions: grammar/prepositions.md
      - Passive verbs: grammar/passive-verbs.md
  - Drills:
      - Passive verbs: drills/passive-verbs.md
      - Tense and aspect: drills/tense-aspect.md
  - Tools:
      - Verb tables: tools/verb-tables.md
      - Conjugation patterns: tools/conjugation-patterns.md
      - Aspect forks: tools/aspect-forks.md
