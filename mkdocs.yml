site_name: Modern Greek Notes
site_description: Personal reference notes for learning Modern Greek

theme:
  name: material
  language: en
  font:
    text: Noto Serif
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/sheet.css

extra_javascript:
  - javascripts/drill-frame.js

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Grammar:
      - Articles: greek-articles.md
      - Adjectives: greek-adjectives.md
      - Passive verbs: greek-passive-verbs-when-to-use-them.md
  - Drills:
      - Passive verbs: drills/passive-verbs.md
  - Tools:
      - Verb tables: tools/verb-tables.md
      - Conjugation patterns: tools/conjugation-patterns.md
