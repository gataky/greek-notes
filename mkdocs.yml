site_name: Greek Notes
site_description: Modern Greek grammar notes, drills and a dictionary that work offline

theme:
  name: material
  custom_dir: overrides
  favicon: icons/notes-192.png
  language: en
  font:
    text: Noto Serif
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/theme.css
  - stylesheets/frames.css
  - stylesheets/tables.css
  - stylesheets/home.css
  - stylesheets/greek-font.css

extra_javascript:
  - javascripts/greek-font.js
  - javascripts/drill-frame.js
  - javascripts/home.js
  - javascripts/tables.js
  - javascripts/pwa.js

hooks:
  - hooks/apps.py
  - hooks/pwa.py

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true

# One nav for the three apps: each page's menu shows only its own app's part (hooks/apps.py).
nav:
  - Home: index.md
  - Grammar:
      - Articles: grammar/articles.md
      - Adjectives: grammar/adjectives.md
      - Pronouns:
          - Overview: grammar/pronouns/index.md
          - Personal: grammar/pronouns/personal.md
          - Possessive: grammar/pronouns/possessive.md
          - Demonstrative: grammar/pronouns/demonstrative.md
          - Interrogative: grammar/pronouns/interrogative.md
          - Relative: grammar/pronouns/relative.md
          - Indefinite: grammar/pronouns/indefinite.md
          - Reflexive and emphatic: grammar/pronouns/reflexive.md
      - Numerals: grammar/numerals.md
      - Conjunctions: grammar/conjunctions.md
      - Prepositions: grammar/prepositions.md
      - Passive verbs: grammar/passive-verbs.md
  - Drills:
      - Overview: drills/index.md
      - Passive verbs: drills/passive-verbs.md
      - Tense and aspect: drills/tense-aspect.md
      - Object pronouns: drills/object-pronouns.md
      - Noun gender: drills/noun-gender.md
      - Agreement: drills/agreement.md
      - Prepositions: drills/prepositions.md
      - Numbers: drills/numbers.md
  - Tools:
      - Verb tables: tools/verb-tables.md
      - Conjugation patterns: tools/conjugation-patterns.md
      - Aspect forks: tools/aspect-forks.md
  - Dictionary: dictionary/index.md
