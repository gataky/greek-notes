site_name: Greek Notes
site_description: Modern Greek grammar notes, drills and a dictionary that work offline

# The repository: the GitHub icon at the bottom right of every page, beside the build stamp
# (hooks/version.py). Not repo_url, which would put Material's GitHub button in the notes' header.
extra:
  repo: &repo https://github.com/gataky/greek-notes
  social:
    - icon: fontawesome/brands/github
      link: *repo
      name: Source on GitHub

theme:
  name: material
  custom_dir: overrides
  favicon: icons/home-192.png
  language: en
  font:
    text: Noto Serif
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/theme.css
  - stylesheets/frames.css
  - stylesheets/tables.css
  - stylesheets/app-page.css
  - stylesheets/greek-font.css
  - stylesheets/pickers.css

extra_javascript:
  - javascripts/greek-font.js
  - javascripts/palette.js
  - javascripts/drill-frame.js
  - javascripts/app-bar.js
  - javascripts/tables.js
  - javascripts/pwa.js

hooks:
  - hooks/apps.py
  - hooks/redirects.py
  - hooks/version.py
  - hooks/pwa.py

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true

# One nav for the apps: each page's menu shows only its own app's part (hooks/apps.py). Drills,
# tools and the dictionary are full-page (overrides/app.html) and show no menu, but their titles
# here are their bars' titles.
nav:
  - Greek: index.md
  - Notes: notes/index.md
  - Grammar:
      - Articles: notes/grammar/articles.md
      - Adjectives: notes/grammar/adjectives.md
      - Pronouns:
          - Overview: notes/grammar/pronouns/index.md
          - Personal: notes/grammar/pronouns/personal.md
          - Possessive: notes/grammar/pronouns/possessive.md
          - Demonstrative: notes/grammar/pronouns/demonstrative.md
          - Interrogative: notes/grammar/pronouns/interrogative.md
          - Relative: notes/grammar/pronouns/relative.md
          - Indefinite: notes/grammar/pronouns/indefinite.md
          - Reflexive and emphatic: notes/grammar/pronouns/reflexive.md
      - Numerals: notes/grammar/numerals.md
      - Conjunctions: notes/grammar/conjunctions.md
      - Prepositions: notes/grammar/prepositions.md
      - Passive verbs: notes/grammar/passive-verbs.md
  - Tools:
      - Verb tables: notes/tools/verb-tables.md
      - Conjugation patterns: notes/tools/conjugation-patterns.md
      - Aspect forks: notes/tools/aspect-forks.md
  - Drills:
      - Drills: drills/index.md
      - Active or passive: drills/passive-verbs.md
      - Tense and aspect: drills/tense-aspect.md
      - Verb groups: drills/verb-groups.md
      - Object pronouns: drills/object-pronouns.md
      - Noun gender: drills/noun-gender.md
      - Agreement: drills/agreement.md
      - Prepositions: drills/prepositions.md
      - Numbers: drills/numbers.md
  - Dictionary: dictionary/index.md
  - Labs:
      - Labs: labs/index.md
      - Aspect map: labs/aspect-map.md
