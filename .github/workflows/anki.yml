name: Anki sync tool

# The Go tests, including the check of the committed exports/anki-verbs.json against the
# structs that read it. The site's own checks are in deploy.yml.
on:
  push:
    branches: [main]
    paths:
      - 'anki/**'
      - 'exports/**'
      - 'scripts/build_anki_verbs.js'
      - '.tool-versions'
      - '.github/workflows/anki.yml'
  pull_request:
    paths:
      - 'anki/**'
      - 'exports/**'
      - 'scripts/build_anki_verbs.js'
      - '.tool-versions'
      - '.github/workflows/anki.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anki
    steps:
      - uses: actions/checkout@v4
      # setup-go reads go-version-file as a bare version, not asdf's .tool-versions, so take the
      # golang line from it.
      - id: go
        run: echo "version=$(awk '$1 == "golang" { print $2 }' ../.tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: anki/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o sync ./cmd/sync
