{% extends "base.html" %}

{# Installable app: manifest, icons and home-screen settings (see hooks/pwa.py) #}
{% block extrahead %}
  <link rel="manifest" href="{{ 'manifest.webmanifest' | url }}">
  <link rel="apple-touch-icon" href="{{ 'app/apple-touch-icon.png' | url }}">
  <meta name="theme-color" content="#2094f3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Greek Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
{% endblock %}
